name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        env:
          WA_MASTER_KEY: "d3VZaE9ZcXdJTFpmWkFxcnh2Ujl2M0ZkWm9RWTlhMjA="
          WHATSAPP_APP_SECRET: "ci-dummy-app-secret"
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: "ci-dummy-verify-token"
          APP_BASE_URL: "https://ci-test.example.com"
          MPESA_CALLBACK_SECRET: "ci-dummy-mpesa-secret"
        run: |
          python -m pytest
